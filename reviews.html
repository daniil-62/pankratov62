<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Montserrat',sans-serif;
background:#0f0c03;
color:#fff;
overflow-x:hidden;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 60px;
background:#000;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-weight:800;
font-size:22px;
color:#d4af37;
cursor:pointer;
transition:0.3s;
}

.logo:hover{
text-shadow:0 0 15px rgba(212,175,55,0.8);
}

nav{
display:flex;
gap:30px;
}

nav a{
color:#fff;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

nav a:hover{
color:#d4af37;
}

/* TITLE */

.title{
text-align:center;
padding:100px 20px 60px;
}

.title h1{
font-size:48px;
color:#d4af37;
text-shadow:0 0 20px rgba(212,175,55,0.5);
}

/* GOLD BACKGROUND */

.section{
position:relative;
padding:80px 20px 140px;
}

.section::before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:radial-gradient(circle at center,
rgba(212,175,55,0.15) 0%,
rgba(15,12,3,0.95) 70%);
z-index:-1;
}

/* GLASS PANEL */

.glass{
max-width:1000px;
margin:0 auto;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
border:1px solid rgba(212,175,55,0.3);
box-shadow:
0 0 40px rgba(212,175,55,0.15),
0 20px 60px rgba(0,0,0,0.6);
animation:fadeUp 1s ease forwards;
opacity:0;
transform:translateY(40px);
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

/* FOOTER */

footer{
background:#000;
padding:60px;
text-align:center;
font-size:14px;
color:#ccc;
}
</style>
</head>

<body>

<header>
