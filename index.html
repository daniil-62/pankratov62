<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панкратов Мебель</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#1a1405;color:#fff}

header{
position:fixed;
top:0;
width:100%;
padding:25px 60px;
display:flex;
justify-content:space-between;
align-items:center;
background:#000;
z-index:1000;
}

.logo{
font-weight:800;
font-size:22px;
color:#d4af37;
text-decoration:none;
}

nav{display:flex;gap:30px}

nav a{
color:#fff;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

nav a:hover{color:#d4af37}

nav a.active{
color:#d4af37;
border-bottom:2px solid #d4af37;
padding-bottom:4px;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)),
url('hero.jpg') center/cover no-repeat;
}

.hero h1{
font-size:52px;
color:#d4af37;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:15px 40px;
background:#d4af37;
color:#000;
font-weight:700;
border-radius:40px;
text-decoration:none;
}

.advantages{
padding:120px 80px;
display:flex;
justify-content:center;
gap:50px;
flex-wrap:wrap;
}

.card{
background:#000;
padding:40px;
border-radius:20px;
width:250px;
text-align:center;
}

.card h2{
color:#d4af37;
font-size:36px;
margin-bottom:10px;
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">Панкратов Мебель</a>
<nav>
<a href="works.html">Работы</a>
<a href="video.html">Видео</a>
<a href="reviews.html">Отзывы</a>
<a href="about.html">О нас</a>
<a href="contacts.html">Контакты</a>
</nav>
</header>

<section class="hero">
<div>
<h1>Индивидуальная мебель премиум-класса</h1>
<a href="https://vk.me/pankratovov" target="_blank" class="btn">
Записаться на консультацию
</a>
</div>
</section>

<section class="advantages">

<div class="card">
<h2 class="count" data-target="15">0</h2>
<p>лет опыта</p>
</div>

<div class="card">
<h2 class="count" data-target="1000">0</h2>
<p>реализованных проектов</p>
</div>

<div class="card">
<h2>Собственное производство</h2>
<p>контроль качества</p>
</div>

<div class="card">
<h2>Гарантия качества</h2>
<p>проверенные материалы</p>
</div>

</section>

<script>
const counters=document.querySelectorAll('.count');
counters.forEach(counter=>{
const update=()=>{
const target=+counter.getAttribute('data-target');
const count=+counter.innerText;
const inc=target/80;
if(count<target){
counter.innerText=Math.ceil(count+inc);
setTimeout(update,20);
}else{
counter.innerText=target+"+";
}
};
update();
});
</script>

</body>
</html>
