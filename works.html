<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Работы | Панкратов Мебель</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Montserrat',sans-serif;
background:#0f0f0f;
color:#fff;
overflow-x:hidden;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 60px;
background:#000;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-weight:800;
font-size:22px;
color:#d4af37;
cursor:pointer;
transition:0.3s;
}

.logo:hover{
text-shadow:0 0 15px #d4af37;
}

nav{
display:flex;
gap:30px;
}

nav a{
color:#fff;
text-decoration:none;
font-weight:600;
transition:0.3s;
position:relative;
}

nav a:hover,
nav a.active{
color:#d4af37;
}

nav a.active::after{
content:"";
position:absolute;
bottom:-6px;
left:0;
width:100%;
height:2px;
background:#d4af37;
}

/* TITLE */

.title{
text-align:center;
padding:80px 20px 40px;
opacity:0;
transform:translateY(40px);
animation:fadeUp 1s ease forwards;
}

.title h1{
font-size:48px;
color:#d4af37;
}

/* GALLERY */

.gallery{
padding:40px 80px 120px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.gallery img{
width:100%;
border-radius:18px;
cursor:pointer;
transition:0.4s;
opacity:0;
transform:translateY(40px);
}

.gallery img.show{
opacity:1;
transform:translateY(0);
}

.gallery img:hover{
transform:scale(1.05);
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.lightbox.active{
display:flex;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:12px;
transition:opacity 0.4s ease;
}

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:50px;
color:#d4af37;
cursor:pointer;
user-select:none;
padding:20px;
}

.arrow.left{left:30px;}
.arrow.right{right:30px;}

.close{
position:absolute;
top:30px;
right:40px;
font-size:35px;
cursor:pointer;
}

/* FOOTER */

footer{
background:#000;
padding:60px;
text-align:center;
font-size:14px;
color:#999;
}

/* ANIMATION */

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */

@media(max-width:768px){
header{padding:20px;}
.gallery{padding:30px;}
.title h1{font-size:32px;}
}
</style>
</head>

<body>

<header>
<div class="logo" onclick="location.href='index.html'">Панкратов Мебель</div>
<nav>
<a href="index.html">Главная</a>
<a href="works.html" class="active">Работы</a>
<a href="video.html">Видео</a>
<a href="reviews.html">Отзывы</a>
<a href="about.html">О нас</a>
<a href="contacts.html">Контакты</a>
</nav>
</header>

<div class="title">
<h1>Наши реализованные проекты</h1>
</div>

<section class="gallery">
<img src="kitchen1.jpg">
<img src="kitchen2.jpg">
<img src="kitchen3.jpg">
<img src="kitchen4.jpg">
<img src="kitchen5.jpg">
<img src="kitchen6.jpg">
<img src="kitchen7.jpg">
<img src="kitchen8.jpg">
<img src="kitchen9.jpg">
<img src="kitchen10.jpg">
<img src="kitchen11.jpg">
<img src="kitchen12.jpg">
<img src="kitchen13.jpg">
<img src="kitchen14.jpg">
<img src="kitchen15.jpg">
<img src="kitchen16.jpg">
<img src="kitchen17.jpg">
<img src="kitchen18.jpg">
<img src="kitchen19.jpg">
<img src="kitchen20.jpg">
</section>

<div class="lightbox" id="lightbox">
<span class="close" id="close">✕</span>
<span class="arrow left" id="prev">❮</span>
<img id="lightbox-img">
<span class="arrow right" id="next">❯</span>
</div>

<footer>

г. Рязань, ул. Новоселов 30А  
Телефон: +7 (910) 906-95-95
</footer>

<script>
document.addEventListener("DOMContentLoaded",function(){

const images=document.querySelectorAll(".gallery img");
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");
const next=document.getElementById("next");
const prev=document.getElementById("prev");
const close=document.getElementById("close");

let index=0;

/* плавное появление */
images.forEach((img,i)=>{
setTimeout(()=>img.classList.add("show"), i*80);
});

/* lightbox */
function show(i){
lightboxImg.style.opacity=0;
setTimeout(()=>{
lightboxImg.src=images[i].src;
lightboxImg.style.opacity=1;
},200);
}

images.forEach((img,i)=>{
img.addEventListener("click",()=>{
index=i;
show(index);
lightbox.classList.add("active");
});
});

next.addEventListener("click",()=>{
index=(index+1)%images.length;
show(index);
});

prev.addEventListener("click",()=>{
index=(index-1+images.length)%images.length;
show(index);
});

close.addEventListener("click",()=>{
lightbox.classList.remove("active");
});

document.addEventListener("keydown",e=>{
if(!lightbox.classList.contains("active"))return;
if(e.key==="ArrowRight")next.click();
if(e.key==="ArrowLeft")prev.click();
if(e.key==="Escape")lightbox.classList.remove("active");
});

/* свайп */
let startX=0;
lightbox.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});
lightbox.addEventListener("touchend",e=>{
let endX=e.changedTouches[0].clientX;
if(startX-endX>50)next.click();
if(endX-startX>50)prev.click();
});

});
</script>

</body>
</html>
